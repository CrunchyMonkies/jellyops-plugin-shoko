# Credentials consumed by the plugin's install hook (spec §8.1). All keys are
# optional — provide only what your setup needs:
#   - Embedded first-run + key minting: anidb-* and shoko-username/shoko-password.
#   - Pre-existing key (embedded or external): shoko-apikey (skips first-run/minting).
#   - Fully manual: omit this Secret and paste the key in Jellyfin > Shoko settings.
#
# DO NOT commit real credentials. Prefer a sealed/managed secret (SealedSecrets,
# External Secrets, SOPS) in production; this stringData sample is for illustration.
apiVersion: v1
kind: Secret
metadata:
  name: shoko-creds
  namespace: media
type: Opaque
stringData:
  anidb-username: "REPLACE_ME"
  anidb-password: "REPLACE_ME"
  shoko-username: "Default"
  shoko-password: "REPLACE_ME"
  # shoko-apikey: "REPLACE_ME"   # set to skip first-run/minting (required for external mode)
